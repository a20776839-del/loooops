<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loop — Shop</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F4F8EF; --ink:#1F4A46; --muted:#566A67; --line:#E3EADB;
  --accent:#A7D676; --accent-ink:#16230D; --ph1:#EAF1E2; --ph2:#D6E4C6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}

:root[data-theme="dark"]{--bg:#10150F; --surface:#182017; --ink:#EEF3EA; --muted:#9AAA9A; --line:#27322A; --accent:#B6E08A; --accent-ink:#10190A; --ph1:#232D22; --ph2:#2F3C2E;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header{transition:transform .3s ease}
header.hide{transform:translateY(calc(-100% - env(safe-area-inset-top,0px)))}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:100px;max-width:none;padding:0 clamp(20px,3vw,40px)}
.tools{display:flex;align-items:center;justify-content:flex-end;gap:14px}
.cur{position:relative;margin-right:6px}
.cur-btn{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;color:var(--ink);font-size:12px;letter-spacing:.14em}
.cur-menu{position:absolute;right:0;top:calc(100% + 8px);margin:0;padding:6px;list-style:none;background:var(--bg);border:1px solid var(--line);border-radius:8px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.08);z-index:20}
.cur-menu[hidden]{display:none}
.cur-menu button{display:flex;justify-content:space-between;gap:16px;width:100%;background:none;border:0;border-radius:6px;padding:10px 12px;color:var(--ink);font-size:13px;text-align:left}
.cur-menu button:hover,.cur-menu button[aria-selected="true"]{background:var(--surface)}
.cur-menu span:first-child{letter-spacing:.1em;font-weight:600}
.cur-menu span:last-child{color:var(--muted)}


.icon{position:relative;background:none;border:0;padding:4px;color:var(--ink);display:grid;place-items:center}
.icon b{position:absolute;top:-3px;right:-7px;background:var(--accent);color:var(--accent-ink);min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;font-size:10px;padding:0 4px}
.logo{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:700;font-size:clamp(40px,5vw,64px);letter-spacing:-.01em;text-align:center;color:var(--ink)}
nav{display:flex;justify-content:safe center;gap:clamp(18px,3vw,40px);padding:0 20px 14px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);opacity:.75;padding-bottom:4px;border-bottom:1.5px solid transparent}
nav a:hover,nav a[aria-current="page"]{opacity:1;border-bottom-color:var(--accent)}



.hero{padding:72px 0 40px}
.hero h1{font-size:clamp(40px,7vw,84px);line-height:1;letter-spacing:-.04em;font-weight:800;margin:0 0 20px;max-width:12ch}
.hero p{color:var(--muted);font-size:18px;max-width:46ch;margin:0}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:32px 0 24px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:28px 20px;padding-bottom:80px}
.card{display:block}
.ph{aspect-ratio:4/5;border-radius:6px;background:linear-gradient(135deg,var(--ph1),var(--ph2));display:grid;place-items:center;color:var(--muted);font-size:13px;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:12px;top:12px;background:var(--surface);color:var(--ink);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.card .meta{display:flex;justify-content:space-between;gap:12px;margin-top:12px;font-size:15px}
.card .name{font-weight:600}
.card .cat{color:var(--muted);font-size:13px}
.card:hover .name{text-decoration:underline;text-underline-offset:3px}

.crumb{padding:24px 0;color:var(--muted);font-size:14px}
.crumb a:hover{color:var(--ink)}
.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;padding-bottom:80px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gallery .ph:first-child{grid-column:1/-1;aspect-ratio:1/1}
.gallery .ph{aspect-ratio:1/1}
.info{align-self:start;position:sticky;top:160px}
.info h1{font-size:clamp(30px,4vw,44px);letter-spacing:-.03em;line-height:1.1;margin:0 0 8px}
.price{font-size:24px;font-weight:600;margin:0 0 20px}
.desc{color:var(--muted);max-width:52ch;margin:0 0 28px}
.label{font-size:13px;font-weight:600;margin-bottom:10px;display:block}
.swatches{display:flex;gap:10px;margin-bottom:24px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;margin-bottom:24px;background:var(--surface)}
.qty button{width:40px;height:40px;border:0;background:none;color:var(--ink);font-size:18px}
.qty span{min-width:28px;text-align:center;font-weight:600}
.actions{display:grid;gap:12px;max-width:420px}
.btn{height:54px;border-radius:999px;font-weight:600;font-size:16px;border:1.5px solid var(--ink);transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.specs{margin-top:36px;border-top:1px solid var(--line);max-width:420px}
.specs div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.specs dt{color:var(--muted)} .specs dd{margin:0;font-weight:500}

.h-hero{position:relative;min-height:calc(100svh - 140px);display:flex;align-items:flex-end}
/* Replace the gradient below with your brand photo: background:url("...") center/cover; */
.h-bg{position:absolute;inset:0;background:linear-gradient(160deg,var(--ph1),var(--ph2))}
.h-inner{position:relative;padding-bottom:64px;padding-top:80px}
.h-hero h1{font-size:clamp(44px,9vw,128px);line-height:.95;letter-spacing:-.045em;font-weight:800;margin:0 0 24px}
.h-hero p{font-size:clamp(16px,2vw,20px);max-width:44ch;margin:0 0 32px}
.h-cta{display:inline-flex;align-items:center;justify-content:center;padding:0 32px}
.story{display:grid;grid-template-columns:1fr 2fr;gap:48px;padding-top:80px;padding-bottom:80px;background:var(--ph1);box-shadow:0 0 0 100vmax var(--ph1);clip-path:inset(0 -100vmax)}
.story h2{font-size:15px;font-weight:600;margin:6px 0 0;color:var(--muted)}
.story .lead{font-size:clamp(20px,2.3vw,30px);line-height:1.4;letter-spacing:-.015em;font-weight:500;margin:0;max-width:34em}
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;padding-top:56px;padding-bottom:96px}
.values h3{font-size:20px;margin:0 0 8px;letter-spacing:-.02em}
.values p{color:var(--muted);margin:0;max-width:34ch}
.band{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;padding-bottom:96px}
.band .ph{aspect-ratio:4/3}
.closing{text-align:center;padding:40px 20px 120px}
.closing h2{font-size:clamp(32px,5vw,64px);letter-spacing:-.04em;line-height:1.05;margin:0 0 28px}
.page-head{padding-top:56px}
.page-head h1{font-size:clamp(36px,5vw,56px);letter-spacing:-.03em;margin:0 0 6px}
.page-head p{color:var(--muted);margin:0}

@media (max-width:820px){.story{grid-template-columns:1fr;gap:16px;padding:64px 20px}.values{grid-template-columns:1fr;padding-bottom:64px}.band{grid-template-columns:1fr;padding-bottom:64px}}
.icon.on::after{content:"";position:absolute;top:2px;right:-2px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:1.5px solid var(--bg)}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.45);display:grid;place-items:center;padding:20px;z-index:30}
.modal[hidden],.search[hidden]{display:none}
.sheet{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;width:100%;max-width:400px;padding:28px;position:relative;max-height:100%;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.x{position:absolute;right:14px;top:10px;background:none;border:0;font-size:26px;color:var(--muted)}
.tabs{display:flex;gap:20px;margin:0 0 20px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;padding:0 0 10px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.g-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:48px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.or{text-align:center;color:var(--muted);font-size:12px;margin:16px 0}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.field input{width:100%;height:46px;border:1px solid var(--line);border-radius:8px;padding:0 14px;background:var(--surface);color:var(--ink);font:inherit}
.sheet .btn{width:100%;margin-top:8px}
.search{position:relative;border-top:1px solid var(--line);background:var(--bg)}
.s-top{display:flex;gap:16px;align-items:center;padding:20px clamp(20px,3vw,40px)}
.s-top input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:clamp(14px,1.6vw,20px);letter-spacing:.16em;text-transform:uppercase;color:var(--ink);outline:none;text-overflow:ellipsis}
.s-top input::placeholder{color:var(--muted);opacity:1}
#sres{position:absolute;left:0;right:0;top:100%;background:var(--bg);border-bottom:1px solid var(--line);max-height:70vh;overflow:auto;padding:0 clamp(20px,3vw,40px)}
#sres:empty{display:none}
.s-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px;margin:20px 0 28px}
.s-empty{color:var(--muted);margin:20px 0 28px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;letter-spacing:.04em}
.back:hover{opacity:.7}
.drawer-bg{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:30;display:flex;justify-content:flex-end}
.drawer-bg[hidden]{display:none}
.drawer{background:var(--bg);color:var(--ink);width:100%;max-width:420px;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid var(--line)}
.d-head h2{margin:0;font-size:20px}
.d-body{flex:1;overflow:auto;padding:0 24px}
.d-foot{padding:20px 24px;border-top:1px solid var(--line)}
.d-foot .btn{width:100%}
.d-empty{color:var(--muted);padding:48px 0;text-align:center}
.ci{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}
.ci .ph{aspect-ratio:1/1;border-radius:6px}
.ci .n{font-weight:600}
.ci .meta-s{display:flex;align-items:center;color:var(--muted);font-size:14px;margin-top:2px}
.ci .sw-s{width:10px;height:10px;border-radius:50%;margin-right:8px;box-shadow:0 0 0 1px var(--line)}
.ci .row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.ci .qty{margin:0}
.ci .qty button{width:32px;height:32px}
.ci .rm{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.total{display:flex;justify-content:space-between;font-weight:600;font-size:17px;margin-bottom:14px}
.qband{position:relative;margin-bottom:96px}
.qband .ph{aspect-ratio:21/9;border-radius:0}
.qband h2{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:0 20px;font-family:"Playfair Display",Georgia,serif;font-size:clamp(28px,5vw,64px);letter-spacing:-.02em;text-align:center;color:var(--ink)}
.stories{padding-bottom:96px}
.sec-t{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 24px}
.s-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.s-grid .ph{aspect-ratio:4/3;margin-bottom:16px}
.s-grid h3{margin:0 0 8px;font-size:18px}
.s-grid p{color:var(--muted);margin:0 0 12px;font-size:14px}
.more{font-size:13px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1.5px solid var(--accent);padding-bottom:2px}
.page{max-width:760px;padding-bottom:96px}
.page h1{font-size:clamp(32px,5vw,52px);letter-spacing:-.03em;margin:0 0 24px}
.page p{color:var(--muted);max-width:62ch;margin:0 0 16px}
.page details{border-bottom:1px solid var(--line);padding:16px 0}
.page details:first-of-type{border-top:1px solid var(--line)}
.page summary{cursor:pointer;font-weight:600;color:var(--ink)}
.page details p{margin:12px 0 0}
.page .note{font-size:12px;margin-top:40px}
.cform{margin-top:32px;max-width:480px}
.cform .btn{width:100%;margin-top:8px}
.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:10;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:820px){
  .bar{height:72px;grid-template-columns:1fr auto}.bar>span{display:none}.logo{font-size:36px;text-align:left}
  .detail{grid-template-columns:1fr;gap:28px}
  .info{position:static}
  .hero{padding-top:44px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.season{display:grid;grid-template-columns:1fr 1fr;min-height:min(100svh,880px);margin-bottom:96px}
.season-t{background:var(--surface);display:flex;align-items:center;justify-content:center;padding:64px clamp(24px,6vw,96px)}
.season-t>div{max-width:520px}
.season .ph{aspect-ratio:auto;border-radius:0;min-height:100%}
.season h2{font-size:clamp(28px,3.4vw,52px);font-weight:300;letter-spacing:.14em;text-transform:uppercase;line-height:1.15;margin:0 0 28px}
.season p{color:var(--ink);max-width:52ch;margin:0 0 20px;font-size:15px}
.season .btn{margin-top:12px}
footer{background:var(--ink);color:var(--surface);font-size:13px}
.news{text-align:center;padding:72px 20px;border-bottom:1px solid rgba(255,255,255,.18)}
.news h2{font-size:clamp(22px,2.6vw,34px);font-weight:300;letter-spacing:.2em;text-transform:uppercase;margin:0 0 16px}
.news p{margin:0 0 28px;font-size:13px;opacity:.9}
.news form{display:flex;gap:16px;justify-content:center;max-width:620px;margin:0 auto}
.news input{flex:1;min-width:0;height:48px;border:1px solid rgba(255,255,255,.4);border-radius:0;padding:0 16px;background:transparent;color:#fff;font:inherit;font-size:13px}
.news input::placeholder{color:rgba(255,255,255,.75)}
.news button{height:48px;padding:0 40px;border:0;border-radius:0;background:#fff;color:var(--ink);font-size:12px;letter-spacing:.2em;text-transform:uppercase}
.marquee{overflow:hidden;border-bottom:1px solid rgba(255,255,255,.18);padding:64px 0}
.m-track{display:flex;width:max-content;animation:mq 28s linear infinite}
.m-track span{font-size:clamp(32px,5vw,72px);font-weight:300;letter-spacing:.18em;text-transform:uppercase;white-space:nowrap;padding-right:.9em}
@keyframes mq{to{transform:translateX(-50%)}}
.f-links{display:flex;justify-content:space-between;gap:32px;padding:56px clamp(20px,3vw,40px) 40px}
.f-links div{display:flex;flex-direction:column;gap:14px}
.f-links div:last-child{text-align:right}
.f-links a{opacity:.85}
.f-links a:hover{opacity:1;text-decoration:underline}
.f-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:0 clamp(20px,3vw,40px) 32px}
.f-social{display:flex;gap:22px;margin-bottom:28px}
.f-social button{background:none;border:0;color:var(--surface);padding:0;display:grid}
.copy{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.pay{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:340px}
.pay span{background:#fff;color:#222;border-radius:4px;padding:6px 10px;font-size:11px;font-weight:700;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){.m-track{animation:none}}
@media (max-width:820px){.season{grid-template-columns:1fr;min-height:0;margin-bottom:64px}.season .ph{aspect-ratio:4/5;min-height:0}.s-grid{grid-template-columns:1fr}.qband{margin-bottom:64px}.qband .ph{aspect-ratio:4/3}.stories{padding-bottom:64px}.news form{flex-direction:column}.f-bottom{flex-direction:column;align-items:flex-start}.pay{justify-content:flex-start}}
.btn,.g-btn,.chip,.qty,.tag,.field input,.field textarea,.cur-menu,.sheet{border-radius:2px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.h-hero h1,.closing h2,.info h1,.page-head h1,.page h1{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em;line-height:1.05}
.dots{display:flex;gap:6px;margin-top:8px;opacity:0;transition:opacity .25s}
.dots i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.card:hover .dots{opacity:1}
.card .ph img{transition:transform .5s}
.card:hover .ph img{transform:scale(1.04)}
@media (hover:none){.dots{opacity:1}}
.acc{margin-top:32px;max-width:420px;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line);padding:14px 0}
.acc summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"+";font-weight:400}
.acc details[open] summary::after{content:"\2212"}
.acc p{color:var(--muted);font-size:14px;margin:10px 0 0}
.acc .specs{margin-top:10px;border-top:0}
.acc .specs div:last-child{border-bottom:0}
.more-s{padding-bottom:40px}
.ph{text-align:center;line-height:1.5}
.card .ph{aspect-ratio:1/1}
a.more{display:inline-block}
.slot-l{position:absolute;right:20px;top:16px;font-size:12px;color:var(--muted);text-align:right;line-height:1.5}
.h-hero.has-img h1,.h-hero.has-img p{color:#fff}
.h-hero.has-img .h-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.5),rgba(0,0,0,.08))}
.qband .ph{position:relative}
.qband .ph span{position:absolute;left:16px;top:12px;font-size:12px;text-align:left}
.qband.has-img .ph::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3)}
.qband.has-img h2{color:#fff}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}}
.nf{padding-top:120px;padding-bottom:120px;text-align:center}
.nf p{color:var(--muted);margin:0 0 24px}
.checkout{padding-bottom:96px}
.co-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:56px;align-items:start}

let teamT=null;
function initTeam(){
  clearInterval(teamT);
  const track=$("#tTrack"); if(!track)return;
  const n=SITE.team.members.length, dots=[...document.querySelectorAll("#tDots button")];
  /* a copy of the first slide sits after the last one, so the last slide glides on to the first */
  if(n>1){const c=track.children[0].cloneNode(true);c.setAttribute("aria-hidden","true");track.appendChild(c);}
  const slides=[...track.children].slice(0,n);
  let i=0,pos=0;
  const setX=(k,anim)=>{track.style.transition=anim?"transform .7s ease":"none";track.style.transform=`translateX(-${k*100}%)`;pos=k;};
  const mark=()=>{dots.forEach((d,j)=>d.setAttribute("aria-current",j===i));slides.forEach((s,j)=>s.setAttribute("aria-hidden",j!==i));};
  const snap=()=>{if(pos===n){setX(0,false);void track.offsetWidth;}};   /* unseen jump from the copy back to the real first slide */
  const go=k=>{
    snap();
    if(k>=n){setX(n,true);i=0;}
    else if(k<0){setX(n,false);void track.offsetWidth;setX(n-1,true);i=n-1;}
    else{setX(k,true);i=k;}
    mark();
  };
  track.addEventListener("transitionend",e=>{if(e.target===track)snap();});
  const start=()=>{clearInterval(teamT); if(!matchMedia("(prefers-reduced-motion:reduce)").matches&&n>1)teamT=setInterval(()=>go(i+1),5000);};
  dots.forEach(d=>d.onclick=()=>{go(+d.dataset.i);start();});
  $("#tPrev").onclick=()=>{go(i-1);start();};
  $("#tNext").onclick=()=>{go(i+1);start();};
  const box=track.closest(".team");
  box.onmouseenter=()=>clearInterval(teamT);
  box.onmouseleave=start;
  start();
}

    lastOrder=order;
    try{localStorage.setItem("loop_order",JSON.stringify(order));}catch(err){}
    cartItems=[];updateBadge();
    location.hash="#/order";
  };
}
function renderOrder(){
  let o=lastOrder;
  if(!o){try{o=JSON.parse(localStorage.getItem("loop_order")||"null");}catch(e){}}
  if(!o){renderNotFound();return;}
  const rows=o.lines.map(l=>{
    const p=PRODUCTS.find(x=>x.id===l.pid);
    return `<div class="co-row"><div class="ph">${p?ph(p," "):""}</div><div><div class="nm">${T(l.name)}</div><div class="sub">${T("Qty")} ${l.qty}</div></div><div>${fmtC(l.total,o.curr)}</div></div>`;
  }).join("");
  app.innerHTML=`<div class="wrap order"><div class="check">✓</div><h1>${T("Thank you,")} <span id="on"></span></h1><p>${TF("Your order {id} is confirmed. A confirmation email will be sent to {email}.",{id:'<b id="oid"></b>',email:'<span id="oe"></span>'})}</p><div class="co-sum"><h2>${T("Order summary")}</h2>${rows}<div class="co-line"><span>${T("Subtotal")}</span><span>${fmtC(o.sub,o.curr)}</span></div><div class="co-line"><span>${T("Shipping")}</span><span>${o.ship?fmtC(o.ship,o.curr):T("Free")}</span></div><div class="co-line t"><span>${T("Total")}</span><span>${fmtC(o.total,o.curr)}</span></div></div><p class="demo-note">${T("Demo order: no payment was taken and no email is sent.")}</p><a class="btn primary h-cta" href="#/products">${T("Continue shopping")}</a></div>`;
  $("#on").textContent=(o.name||"").split(" ")[0]; $("#oid").textContent=o.id; $("#oe").textContent=o.email;
}
function reveal(){
  if(!("IntersectionObserver" in window))return;
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.08});
  app.querySelectorAll(".target,.story,.values,.diff,.team,.where,.season,.qband,.stories,.closing,.card,.gallery,.more-s").forEach(el=>{el.classList.add("rv");io.observe(el);});
}

function card(p){
  return `<a class="card" href="#/product/${p.id}"><div class="ph">${ph(p)}${p.tag?`<span class="tag">${T(p.tag)}</span>`:""}</div><div class="meta"><div class="name">${hint(p.name,"Product name")}</div><div>${money(p)}</div></div><div class="dots">${p.colors.map(c=>`<i style="background:${c}"></i>`).join("")}</div></a>`;
}

function renderList(){
  const cats=["All"];
  const items=PRODUCTS.filter(p=>filter==="All"||p.cat===filter);
  app.innerHTML=`
  <section class="wrap page-head">
    <h1>${T("Shop")}</h1>
    <p>${T(SITE.shopIntro)}</p>
  </section>
  <section class="wrap">
    <div class="filters">${cats.map(c=>`<button class="chip" aria-pressed="${c===filter}" data-cat="${c}">${T(c)}</button>`).join("")}</div>
    <div class="grid">${items.map(card).join("")}</div>
  </section>`;
  app.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{location.hash=b.dataset.cat==="All"?"#/products":"#/products/"+encodeURIComponent(b.dataset.cat);});
}

function renderDetail(id){
  const p=PRODUCTS.find(x=>x.id===id);
  if(!p){renderNotFound();return;}
  qty=1; color=0;
  app.innerHTML=`
  <div class="wrap">
    <div class="crumb"><a class="back" href="#/products" aria-label="${T("Back to Shop")}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>${T("Shop")}</a></div>
    <div class="detail">
      <div class="gallery">
        <div class="ph">${slot(img(p,0),"Main photo<br>1:1 \u00b7 1200\u00d71200",p.name)}</div>
        <div class="ph">${slot(img(p,1),"Photo 2<br>1:1 \u00b7 1200\u00d71200",p.name)}</div>
        <div class="ph">${slot(img(p,2),"Photo 3<br>1:1 \u00b7 1200\u00d71200",p.name)}</div>
      </div>
      <div class="info">
        <h1>${hint(p.name,"Product name")}</h1>
        <p class="price">${money(p)}</p>
        <p class="desc">${hint(p.desc,"Product description")}</p>
        <span class="label">${T("Color")}</span>
        <div class="swatches" id="sw">${p.colors.map((c,i)=>`<button class="sw" style="background:${c}" aria-label="${T("Color")} ${i+1}" aria-pressed="${i===0}" data-i="${i}"></button>`).join("")}</div>
        <span class="label">${T("Quantity")}</span>
        <div class="qty"><button id="minus" aria-label="${T("Decrease")}">−</button><span id="q">1</span><button id="plus" aria-label="${T("Increase")}">+</button></div>
        <div class="actions">
          <button class="btn primary" id="add">${T("Add to Cart")}</button>
          <button class="btn ghost" id="buy">${T("Buy Now")}</button>
        </div>
        <div class="acc">
          <details open><summary>${T("Details")}</summary><dl class="specs">${Object.entries(p.specs).map(([k,v])=>`<div><dt>${T(k)}</dt><dd>${T(v)}</dd></div>`).join("")}</dl></details>
          <details><summary>${T("Shipping & returns")}</summary><p>${T(SITE.shipping)}</p></details>
          <details><summary>${T("Care")}</summary><p>${hint("","Care instructions")}</p></details>
        </div>
      </div>
    </div>
    <section class="more-s"><h2 class="sec-t">${T("You may also like")}</h2><div class="grid">${PRODUCTS.filter(x=>x.id!==p.id).slice(0,3).map(card).join("")}</div></section>
  </div>`;
  $("#sw").querySelectorAll(".sw").forEach(b=>b.onclick=()=>{
    color=+b.dataset.i; $("#sw").querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed",x===b));
  });
  $("#minus").onclick=()=>{qty=Math.max(1,qty-1);$("#q").textContent=qty;};
  $("#plus").onclick=()=>{qty=Math.min(99,qty+1);$("#q").textContent=qty;};
  $("#add").onclick=()=>{addToCart(p.id,color,qty);toast(TF("Added {n} \u00d7 {p} to your cart",{n:qty,p:T(p.name)||T("Product")}));};
  $("#buy").onclick=()=>{addToCart(p.id,color,qty);if(location.hash==="#/checkout")route();else location.hash="#/checkout";};
}

function renderPage(k){
  const d=PAGES[k];
  if(!d){renderNotFound();return;}
  const body=d.faq?d.faq.map(([q,a])=>`<details><summary>${T(q)}</summary><p>${T(a)}</p></details>`).join(""):d.b.map(x=>`<p>${T(x)}</p>`).join("");
  const form=k==="contact"?`<form class="cform" id="cf"><label class="field"><span>${T("Name")}</span><input required></label><label class="field"><span>${T("Email")}</span><input type="email" required></label><label class="field"><span>${T("Message")}</span><textarea rows="5" required></textarea></label><button class="btn primary" type="submit">${T("Send message")}</button></form>`:"";
  app.innerHTML=`<div class="wrap page"><div class="crumb"><a class="back" href="#/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>${T("Home")}</a></div><h1>${T(d.t)}</h1>${body}${form}${d.real?"":`<p class="note">${T("Sample text. Replace with your own.")}</p>`}</div>`;
  if(form)$("#cf").onsubmit=e=>{e.preventDefault();e.target.reset();toast(T("Message sent (demo)"));};
}

function buildNav(page){
  const items=[["Home","#/","home"],["Shop","#/products","all"],["Where to buy","#/where","where"],["Why Loop","#/why","why"]];
  const cur=page==="home"?"home":page==="where"?"where":page==="why"?"why":page==="other"?"":(filter==="All"?"all":filter);
  $("#nav").innerHTML=items.map(([lbl,h,k])=>`<a href="${h}"${k===cur?' aria-current="page"':''}>${T(lbl)}</a>`).join("");
}

function route(){
  const h=decodeURIComponent(location.hash);
  const m=h.match(/^#\/product\/(\d+)$/);
  const cm=h.match(/^#\/products\/(.+)$/);
  const pm=h.match(/^#\/page\/([\w-]+)$/);
  filter=cm?cm[1]:"All";
  clearInterval(teamT);
  let page="other";
  if(m){renderDetail(+m[1]);page="products";}
  else if(pm)renderPage(pm[1]);
  else if(h==="#/checkout")renderCheckout();
  else if(h==="#/order")renderOrder();
  else if(h==="#/where"){renderWhere();page="where";}
  else if(h==="#/why"){renderWhy();page="why";}
  else if(cm||h==="#/products"){renderList();page="products";}
  else if(h===""||h==="#"||h==="#/"){renderHome();page="home";}
  else renderNotFound();
  buildNav(page);
  reveal();
  window.scrollTo(0,0);
}
let cartItems=[];
try{cartItems=(JSON.parse(localStorage.getItem("loop_cart")||"[]")||[]).filter(c=>PRODUCTS.some(p=>p.id===c.id));}catch(e){cartItems=[];}
function saveCart(){try{localStorage.setItem("loop_cart",JSON.stringify(cartItems));}catch(e){}}
const unit=p=>curr==="USD"?p.price:(p.mxn??Math.round(p.price*RATE_MXN));
const fmtTotal=n=>curr==="USD"?"$"+n.toFixed(2):"MX$"+n.toLocaleString("en-US");
function updateBadge(){$("#cartCount").textContent=cartItems.reduce((a,c)=>a+c.qty,0);saveCart();}
function addToCart(id,ci,q){
  const f=cartItems.find(c=>c.id===id&&c.ci===ci);
  if(f)f.qty=Math.min(99,f.qty+q);else cartItems.push({id,ci,qty:q});
  updateBadge();
  if(!$("#drawer").hidden)renderCart();
}
function renderCart(){
  const b=$("#dbody"),f=$("#dfoot");
  if(!cartItems.length){b.innerHTML=`<p class="d-empty">${T("Your cart is empty.")}</p>`;f.innerHTML="";return;}
  let total=0;
  b.innerHTML=cartItems.map((c,i)=>{
    const p=PRODUCTS.find(x=>x.id===c.id);
    total+=unit(p)*c.qty;
    return `<div class="ci"><div class="ph">${ph(p," ")}</div><div><div class="n">${T(p.name)||T("Product")}</div><div class="meta-s"><span class="sw-s" style="background:${p.colors[c.ci]}"></span>${money(p)}</div><div class="row"><div class="qty"><button data-a="m" data-i="${i}" aria-label="${T("Decrease")}">−</button><span>${c.qty}</span><button data-a="p" data-i="${i}" aria-label="${T("Increase")}">+</button></div><button class="rm" data-a="r" data-i="${i}">${T("Remove")}</button></div></div></div>`;
  }).join("");
  f.innerHTML=`<div class="total"><span>${T("Subtotal")}</span><span>${fmtTotal(total)}</span></div><button class="btn primary" id="co">${T("Checkout")}</button>`;
  $("#co").onclick=()=>{closeCart();if(location.hash==="#/checkout")route();else location.hash="#/checkout";};
}
function openCart(){renderCart();$("#drawer").hidden=false;}
function closeCart(){$("#drawer").hidden=true;}
$("#cartBtn").onclick=openCart;
$("#dx").onclick=closeCart;
$("#drawer").onclick=e=>{if(e.target.id==="drawer")closeCart();};
$("#dbody").onclick=e=>{
  const b=e.target.closest("button[data-a]");
  if(!b)return;
  const i=+b.dataset.i,c=cartItems[i];
  if(b.dataset.a==="p")c.qty=Math.min(99,c.qty+1);
  else if(b.dataset.a==="m")c.qty=Math.max(1,c.qty-1);
  else cartItems.splice(i,1);
  updateBadge();renderCart();
};
let user=null,authTab="login";
try{user=JSON.parse(localStorage.getItem("loop_user")||"null");}catch(e){}
function saveUser(u){
  user=u;
  try{u?localStorage.setItem("loop_user",JSON.stringify(u)):localStorage.removeItem("loop_user");}catch(e){}
  paintUser();
}
function paintUser(){
  $("#acctBtn").classList.toggle("on",!!user);
  $("#acctBtn").setAttribute("aria-label",user?T("Account"):T("Log in"));
}
function openAuth(t){authTab=t||"login";renderAuth();$("#modal").hidden=false;}
function closeAuth(){$("#modal").hidden=true;}
function renderAuth(){
  const s=$("#sheet");
  if(user){
    s.innerHTML=`<button class="x" id="ax" aria-label="${T("Close")}">×</button><h2>${T("Hi,")} <span id="un"></span></h2><p class="sub" id="ue"></p><button class="btn ghost" id="out">${T("Log out")}</button>`;
    $("#un").textContent=user.name; $("#ue").textContent=user.email;
    $("#out").onclick=()=>{saveUser(null);closeAuth();toast(T("Logged out"));};
  }else{
    const su=authTab==="signup";
    s.innerHTML=`<button class="x" id="ax" aria-label="${T("Close")}">×</button>
    <div class="tabs"><button data-t="login" aria-selected="${!su}">${T("Log in")}</button><button data-t="signup" aria-selected="${su}">${T("Sign up")}</button></div>
    <h2>${su?T("Create your account"):T("Welcome back")}</h2>
    <p class="sub">${su?TF("Join {b} to save your orders and favorites.",{b:BRAND}):T("Log in to continue.")}</p>
    <button class="g-btn" id="gbtn" type="button"><b style="color:#4285F4;font-size:18px">G</b> ${T("Continue with Google")}</button>
    <div class="or">${T("or use email")}</div>
    <form id="af">${su?`<label class="field"><span>${T("Name")}</span><input id="an" required autocomplete="name"></label>`:""}
      <label class="field"><span>${T("Email")}</span><input id="ae" type="email" required autocomplete="email"></label>
      <label class="field"><span>${T("Password")}</span><input id="ap" type="password" required minlength="6" autocomplete="${su?"new-password":"current-password"}"></label>
      <button class="btn primary" type="submit">${su?T("Create account"):T("Log in")}</button></form>`;
    s.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{authTab=b.dataset.t;renderAuth();});
    $("#gbtn").onclick=()=>{saveUser({name:"Google user",email:"your-account@gmail.com"});closeAuth();toast(T("Demo: Google sign-in is simulated"));};
    $("#af").onsubmit=e=>{
      e.preventDefault();
      const em=$("#ae").value.trim();
      const name=su?$("#an").value.trim():em.split("@")[0];
      saveUser({name,email:em});closeAuth();toast(T("Welcome,")+" "+name);
    };
  }
  $("#ax").onclick=closeAuth;
}
$("#acctBtn").onclick=()=>openAuth("login");
$("#modal").onclick=e=>{if(e.target.id==="modal")closeAuth();};

function openSearch(){$("#search").hidden=false;$("#sq").value="";runSearch();$("#sq").focus();}
function closeSearch(){$("#search").hidden=true;}
function runSearch(){
  const q=$("#sq").value.trim().toLowerCase();
  const r=q?PRODUCTS.filter(p=>(T(p.name)+" "+p.cat+" "+T(p.desc)).toLowerCase().includes(q)):[];
  $("#sres").innerHTML=!q?'':!r.length?`<p class="s-empty">${T("No results.")}</p>`:`<div class="s-res">${r.map(p=>`<a class="card" href="#/product/${p.id}"><div class="ph">${ph(p)}</div><div class="meta"><div class="name">${hint(p.name,"Product name")}</div><div>${money(p)}</div></div></a>`).join("")}</div>`;
}
$("#searchBtn").onclick=openSearch;
$("#sx").onclick=closeSearch;
$("#sq").oninput=runSearch;
$("#sres").onclick=e=>{if(e.target.closest("a"))closeSearch();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeAuth();closeSearch();closeCart();}});
updateBadge();
renderFooter();
let hov=false;
document.addEventListener("mousemove",e=>{
  const h=$("header");
  if(e.clientY<=24){hov=true;h.classList.remove("hide");}
  else if(hov&&e.clientY>h.offsetHeight+10){
    hov=false;
    if(window.scrollY>120&&$("#search").hidden)h.classList.add("hide");
  }
},{passive:true});
let lastY=window.scrollY;
window.addEventListener("scroll",()=>{
  const y=window.scrollY,h=$("header");
  if(y>120&&y>lastY&&$("#search").hidden&&!hov)h.classList.add("hide");
  else if(y<lastY||y<=120)h.classList.remove("hide");
  lastY=y;
},{passive:true});
document.addEventListener("click",e=>{
  const a=e.target.closest('a[href^="#/"]');
  if(!a)return;
  e.preventDefault();
  const h=a.getAttribute("href");
  if(location.hash===h||(h==="#/"&&location.hash===""))route();else location.hash=h;
});
paintUser();
function setCur(c){
  curr=c;
  $("#curLabel").textContent=c;
  document.querySelectorAll("#curMenu button").forEach(b=>b.setAttribute("aria-selected",b.dataset.c===c));
  toggleMenu(false);
  if(location.hash==="#/checkout"&&$("#cosum"))$("#cosum").innerHTML=coSumHTML();else{const y=window.scrollY; route(); window.scrollTo(0,y);}
  if(!$("#drawer").hidden)renderCart();
}
function applyStatic(){
  document.documentElement.lang=lang;
  const set=(sel,attr,txt)=>{const e=document.querySelector(sel);if(!e)return;if(attr==="text")e.textContent=txt;else e.setAttribute(attr,txt);};
  set("#searchBtn","aria-label",T("Search")); set("#cartBtn","aria-label",T("Cart"));
  set("#sq","placeholder",T("Search for your favorite Loop")); set("#sq","aria-label",T("Search products")); set("#sx","aria-label",T("Close search"));
  set("#dx","aria-label",T("Close cart")); set("#drawer aside","aria-label",T("Cart")); set("#drawer h2","text",T("Cart"));
  set("#nav","aria-label",T("Main"));
  set('#curMenu button[data-c="USD"] span:last-child',"text",T("US Dollar"));
  set('#curMenu button[data-c="MXN"] span:last-child',"text",T("Mexican Peso"));
  set("#langLabel","text",lang.toUpperCase());
  document.querySelectorAll("#langMenu button").forEach(b=>b.setAttribute("aria-selected",b.dataset.l===lang));
  paintUser();
}
function toggleLang(open){$("#langMenu").hidden=!open;$("#langBtn").setAttribute("aria-expanded",open);}
function setLang(l){
  lang=l==="es"?"es":"en";
  try{localStorage.setItem("loop_lang",lang);}catch(e){}
  toggleLang(false);
  applyStatic(); renderFooter();
  const y=window.scrollY; route(); window.scrollTo(0,y);
  if(!$("#drawer").hidden)renderCart();
  if(!$("#modal").hidden)renderAuth();
  if(!$("#search").hidden)runSearch();
}
function toggleMenu(open){
  $("#curMenu").hidden=!open; $("#curBtn").setAttribute("aria-expanded",open);
}
$("#curBtn").onclick=e=>{e.stopPropagation();toggleLang(false);toggleMenu($("#curMenu").hidden);};
$("#langBtn").onclick=e=>{e.stopPropagation();toggleMenu(false);toggleLang($("#langMenu").hidden);};
document.querySelectorAll("#langMenu button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.querySelectorAll("#curMenu button").forEach(b=>b.onclick=()=>setCur(b.dataset.c));
document.addEventListener("click",()=>{toggleMenu(false);toggleLang(false);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){toggleMenu(false);toggleLang(false);}});
window.addEventListener("hashchange",route);
applyStatic();
renderFooter();
route();
</script>
</body>
</html>
